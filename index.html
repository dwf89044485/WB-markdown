  const CHECK_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" style="display:block"><path fill="currentColor" transform="matrix(1 0 0 1 3 3.99854)" d="M5.1314 6.7172L11.4243 0.4243L10.5757 -0.4243L4.2828 5.8686L4.2732 5.8783Q4.0908 6.0607 4 6.1423Q3.9092 6.0607 3.7268 5.8783L3.7172 5.8686L0.4243 2.5757L-0.4243 3.4243L2.8686 6.7172L2.8783 6.7268Q3.1924 7.041 3.3327 7.1476Q3.6556 7.3929 4 7.3929Q4.3444 7.3929 4.6673 7.1476Q4.8076 7.041 5.1217 6.7268L5.1314 6.7172Z" fill-rule="evenodd"/></svg>';

  document.addEventListener('click', function(e) {
    const btn = e.target.closest('.tbl-btn.tbl-copy');
    if (!btn) return;
    const outer = btn.closest('.tbl-outer');
    if (!outer) return;
    const table = outer.querySelector('table');
    if (!table) return;
    let text = '';
    table.querySelectorAll('tr').forEach(function(row) {
      const cells = row.querySelectorAll('th, td');
      text += Array.from(cells).map(function(c) { return c.innerText.trim(); }).join('\t') + '\n';
    });
    const content = text.trim();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(content).catch(function(){});
    } else {
      const ta = document.createElement('textarea');
      ta.value = content;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    btn.innerHTML = CHECK_SVG;
    btn.style.color = '#34C759';
    setTimeout(function() {
      btn.innerHTML = COPY_SVG;
      btn.style.color = '';

  });

      var cells = row.querySelectorAll('th, td');
      txt += Array.from(cells).map(function(c) { return c.innerText.trim(); }).join('\t') + '\n';
    });

      navigator.share({ text: txt.trim() }).catch(function(){});

      if (navigator.clipboard && navigator.clipboard.writeText) {

/* ── 表格全屏查看 ───────────────────────────────────────── */
(function(){
  var shell = document.querySelector('.phone-shell');
  var overlay = document.getElementById('tblOverlay');
  var content = document.getElementById('tblFsContent');
  var fsBack = document.getElementById('tblFsBack');

  /* ── 获取注册表中图标 ────────────────────────────────── */
  var INLINE = window.WORKBUDDY_INLINE_ICONS || {};
  function fsIcon(file) {
    var raw = INLINE[file];
    if (!raw) return '';
    return raw
      .replace(/fill="#[0-9a-fA-F]+"/g, 'fill="currentColor"')
      .replace(/stroke="#[0-9a-fA-F]+"/g, 'stroke="currentColor"');
  }

  var FS_COPY = fsIcon('wb-copy.svg');
  var FS_IMAGE = fsIcon('image.svg');

  /* ── 初始化按钮图标 ──────────────────────────────────── */
  var actionBtns = document.querySelectorAll('.tbl-fs-btn[data-action]');
  actionBtns.forEach(function(b){
    var a = b.getAttribute('data-action');
    if (a === 'copy') b.innerHTML = FS_COPY || COPY_SVG;
    if (a === 'save-image') b.innerHTML = FS_IMAGE;
  });

  function isMobileFsMode(){
    return !document.documentElement.classList.contains('force-desktop') &&
      window.matchMedia('(max-width: 900px)').matches;
  }

  function isLandscapeViewport(){
    var vv = window.visualViewport;
    var width = vv ? vv.width : window.innerWidth;
    var height = vv ? vv.height : window.innerHeight;
    return width > height;
  }

  function syncFullscreenOrientation(){
    if (!overlay.classList.contains('is-active')) return;
    if (!isMobileFsMode()) {
      overlay.classList.remove('tbl-mobile', 'tbl-mobile-portrait', 'tbl-mobile-landscape');
      shell.classList.add('tbl-landscape');
      return;
    }
    shell.classList.remove('tbl-landscape');
    overlay.classList.add('tbl-mobile');
    if (isLandscapeViewport()) {
      overlay.classList.add('tbl-mobile-landscape');
      overlay.classList.remove('tbl-mobile-portrait');
    } else {
      overlay.classList.add('tbl-mobile-portrait');
      overlay.classList.remove('tbl-mobile-landscape');
    }
  }

  /* ── 全屏入口 ────────────────────────────────────────── */
  document.addEventListener('click', function(e){
    var btn = e.target.closest('.tbl-btn.tbl-maximize');
    if (!btn) return;
    var outer = btn.closest('.tbl-outer');
    if (!outer) return;
    var table = outer.querySelector('table');
    if (!table) return;
    /* 克隆表格 HTML 放入内容区 */
    content.innerHTML = '<div class="tbl-outer"><div class="tbl-wrap">' + table.outerHTML + '</div></div>';
    overlay.classList.add('is-active');
    syncFullscreenOrientation();
  });

  window.addEventListener('resize', syncFullscreenOrientation);
  window.addEventListener('orientationchange', syncFullscreenOrientation);
  if (window.visualViewport) {
    window.visualViewport.addEventListener('resize', syncFullscreenOrientation);
  }

  /* ── 返回 ─────────────────────────────────────────────── */
  function closeFullscreen(){
    overlay.classList.remove('is-active', 'tbl-mobile', 'tbl-mobile-portrait', 'tbl-mobile-landscape');
    shell.classList.remove('tbl-landscape');
    content.innerHTML = '';
  }
  fsBack.addEventListener('click', closeFullscreen);

  /* ── 复制 ─────────────────────────────────────────────── */
  document.addEventListener('click', function(e){
    var btn = e.target.closest('.tbl-fs-btn[data-action="copy"]');
    if (!btn) return;
    var tbl = content.querySelector('table');
    if (!tbl) return;
    var txt = '';
    tbl.querySelectorAll('tr').forEach(function(row){
      var cells = row.querySelectorAll('th, td');
      txt += Array.from(cells).map(function(c){ return c.innerText.trim(); }).join('\t') + '\n';
    });
    var text = txt.trim();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).catch(function(){});
    } else {
      var ta = document.createElement('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
    }
    /* 反馈 */
    var orig = btn.innerHTML;
    btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="22" height="22" style="display:block"><path fill="currentColor" transform="matrix(1 0 0 1 3 3.99854)" d="M5.1314 6.7172L11.4243 0.4243L10.5757 -0.4243L4.2828 5.8686L4.2732 5.8783Q4.0908 6.0607 4 6.1423Q3.9092 6.0607 3.7268 5.8783L3.7172 5.8686L0.4243 2.5757L-0.4243 3.4243L2.8686 6.7172L2.8783 6.7268Q3.1924 7.041 3.3327 7.1476Q3.6556 7.3929 4 7.3929Q4.3444 7.3929 4.6673 7.1476Q4.8076 7.041 5.1217 6.7268L5.1314 6.7172Z" fill-rule="evenodd"/></svg>';
    btn.style.color = '#34C759';
    btn.classList.add('is-checked');
    setTimeout(function(){
      btn.innerHTML = orig;
      btn.style.color = '';
      btn.classList.remove('is-checked');
    }, 1000);
  });

  /* ── 保存图片（占位） ──────────────────────────────────── */
  document.addEventListener('click', function(e){
    var btn = e.target.closest('.tbl-fs-btn[data-action="save-image"]');
    if (!btn) return;
    console.log('保存图片：待实现');
  });

  /* ── 分享（占位） ───────────────────────────────────────── */
  document.addEventListener('click', function(e){
    var btn = e.target.closest('.tbl-fs-btn[data-action="share"]');
    if (!btn) return;
    var tbl = content.querySelector('table');
    if (!tbl) return;
    var txt = '';
    tbl.querySelectorAll('tr').forEach(function(row){
      var cells = row.querySelectorAll('th, td');
      txt += Array.from(cells).map(function(c){ return c.innerText.trim(); }).join('\t') + '\n';
    });
    if (navigator.share) {
      navigator.share({ text: txt.trim() }).catch(function(){});
    } else {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(txt.trim()).catch(function(){});
      } else {
        var ta = document.createElement('textarea');
        ta.value = txt.trim();
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
    }
  });
})();
</script>
