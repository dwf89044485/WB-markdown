<!-- ── 渲染主脚本 ── -->
<script type="module">
import { getFrames, renderEvent, renderTodo, renderSearchItem } from './engine/sheet.js';
import { ICONS } from './engine/icons.js';

const scenario = window.WORKBUDDY_SCENARIO;
const $ = (sel, root = document) => root.querySelector(sel);

// ── 复用 renderSheet 内部的 computeTodoSnapshot 逻辑 ──
function computeTodoSnapshot(frames, baseline) {
  const lastOverrideFrame = [...frames].reverse().find(f =>
    (f.todoOverrides !== undefined) || (f.todos && f.todos.length)
  );
  if (!lastOverrideFrame) return [];
  if (lastOverrideFrame.todoOverrides !== undefined) {
    const overrideMap = {};
    (lastOverrideFrame.todoOverrides || []).forEach(o => { overrideMap[o.index] = o.status; });
    return baseline.map((text, i) => ({ text, status: overrideMap[i] || 'todo' }));
  }
  return lastOverrideFrame.todos;
}

// ── 一次性渲染所有 events+todos 到指定的 sheet body ──
function renderToBody(body, frameRefs, extraEvents) {
  const frames = getFrames(frameRefs);
  const baseline = scenario.todosBaseline || [];
  const todos = computeTodoSnapshot(frames, baseline);

  // 渲染所有事件行
  const allFrames = frames.slice();
  for (const f of allFrames) {
    if (f.events) {
      for (const ev of f.events) {
        body.appendChild(renderEvent(ev));
        if (ev.outputs) {
          ev.outputs.forEach(out => {
            if (out.type === 'search') body.appendChild(renderSearchItem(out.text));
          });
        }
      }
    }
    // 旧格式兼容
    if (f.searchItems && !f.events?.some(ev => ev.outputs)) {
      f.searchItems.forEach(item => body.appendChild(renderSearchItem(item)));
    }
  }

  // 附加额外事件（用于非帧来源的手工渲染）
  if (extraEvents) {
    extraEvents.forEach(ev => body.appendChild(ev));
  }

  // 渲染待办
  todos.forEach(t => body.appendChild(renderTodo(t)));
}

// ════════════════════════════════════════════════════
//  1. 思考过程
// ════════════════════════════════════════════════════
renderToBody($('#body-thinking'), 'T.c');

// ════════════════════════════════════════════════════
//  2. 创建待办
// ════════════════════════════════════════════════════
renderToBody($('#body-create-todo'), 'F1.a');

// ════════════════════════════════════════════════════
//  3. 更新待办
// ════════════════════════════════════════════════════
renderToBody($('#body-update-todo'), 'F3.6a');

// ════════════════════════════════════════════════════
//  4. 搜索网页（含搜索结果 outputs）
// ════════════════════════════════════════════════════
renderToBody($('#body-web-search'), 'F1.g');

// ════════════════════════════════════════════════════
//  5. 搜索文件
// ════════════════════════════════════════════════════
renderToBody($('#body-file-search'), 'F3.3b');

// ════════════════════════════════════════════════════
//  6. 生成图片
// ════════════════════════════════════════════════════
renderToBody($('#body-image-gen'), 'F2.d');

// ════════════════════════════════════════════════════
//  7. 调用技能（含 skill card）
// ════════════════════════════════════════════════════
renderToBody($('#body-skill'), 'F3.1b');

// ════════════════════════════════════════════════════
//  8. 委派 Subagent（含 card）
// ════════════════════════════════════════════════════
renderToBody($('#body-subagent'), 'F3.5c');

// ════════════════════════════════════════════════════
//  9. 文件创建失败（⚠️ warning）
// ════════════════════════════════════════════════════
renderToBody($('#body-file-fail'), 'F3.2b');

// ════════════════════════════════════════════════════
// 10. 创建文件（⚠️→✏️）
// ════════════════════════════════════════════════════
renderToBody($('#body-create-file'), 'F3.2c');

// ════════════════════════════════════════════════════
// 11. 读取文件（⚠️→✏️→👀+card）
// ════════════════════════════════════════════════════
renderToBody($('#body-read-file'), 'F3.2d');

// ════════════════════════════════════════════════════
// 12. 编辑文件（⚠️→✏️→👀→✏️+patch card）
// ════════════════════════════════════════════════════
renderToBody($('#body-edit-file'), 'F3.2e');

// ════════════════════════════════════════════════════
// 13. 执行命令（🖥️ ×3 + chevron）
// ════════════════════════════════════════════════════
renderToBody($('#body-command'), 'F3.4d');

// ════════════════════════════════════════════════════
// 14. 搜索结果条目（子元素展示）
// ════════════════════════════════════════════════════
(function(){
  const body = $('#body-search-items');
  ['大阪关西-Top500件大阪关西 - 2025年2月更新',
   '2025年06月东京地铁卡销量排行榜前10名',
   '一篇文章带你了解日本交通，电车、新干线、JR P']
    .forEach(t => body.appendChild(renderSearchItem(t)));
})();

// ════════════════════════════════════════════════════
// 15. 待办三种状态（todo / active / done）
// ════════════════════════════════════════════════════
(function(){
  const body = $('#body-todo-states');
  body.appendChild(renderTodo({ text: '调研日本入境政策', status: 'todo' }));
  body.appendChild(renderTodo({ text: '查询关西天气趋势', status: 'active' }));
  body.appendChild(renderTodo({ text: '整理旅行方案文档', status: 'done' }));
})();

// ════════════════════════════════════════════════════
// 16. 空状态
// ════════════════════════════════════════════════════
(function(){
  const body = $('#body-empty');
  const empty = document.createElement('div');
  empty.className = 'sheet-empty';
  empty.textContent = '当前状态暂无新增事件。';
  body.appendChild(empty);
})();

console.log('Sheet types reference rendered successfully.');
</script>
