<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sidebar V7 — WorkBuddy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      /* Spotify 主题色 — 与项目 globals.css 对齐 */
      --background: #FCFCFC;
      --foreground: #1A1A1A;
      --card: #FCFCFC;
      --muted: #EFEFEF;
      --muted-foreground: #3E3E3E;
      --primary: #00C29A;
      --primary-foreground: #FFFFFF;
      --popover: #FCFCFC;
      --border: #D9D9D9;
      --success: #00C29A;
      --radius: 0.625rem;
      --sidebar-width: 300px;
    }

    body {
      font-family: 'Open Sans', system-ui, -apple-system, sans-serif;
      background: #F0F0F0;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    /* ─── 背景页面内容（模拟主页面） ─── */
    .bg-page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: filter 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .bg-page.blurred {
      filter: blur(2px) brightness(0.97);
    }

    .bg-header {
      padding: 56px 20px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .bg-hamburger {
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: none;
      cursor: pointer;
      border-radius: 12px;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .bg-hamburger:hover {
      background: rgba(0,0,0,0.06);
    }
    .bg-hamburger svg {
      width: 22px;
      height: 22px;
      color: var(--foreground);
    }
    .bg-title {
      font-size: 20px;
      font-weight: 700;
      color: var(--foreground);
      flex: 1;
    }

    .bg-content {
      flex: 1;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      text-align: center;
    }
    .bg-content .placeholder-icon {
      width: 80px;
      height: 80px;
      color: #ccc;
    }
    .bg-content p {
      font-size: 16px;
      color: var(--muted-foreground);
      line-height: 1.6;
      max-width: 260px;
    }
    .bg-content .cta-btn {
      margin-top: 8px;
      padding: 12px 32px;
      border-radius: 24px;
      background: var(--primary);
      color: var(--primary-foreground);
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: transform 0.15s, box-shadow 0.15s;
      box-shadow: 0 4px 16px rgba(0, 194, 154, 0.3);
    }
    .bg-content .cta-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(0, 194, 154, 0.4);
    }

    /* ─── 遮罩层 ─── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
      z-index: 90;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.35s cubic-bezier(0.4, 0, 0.2, 1),
                  visibility 0.35s;
      backdrop-filter: blur(1px);
      -webkit-backdrop-filter: blur(1px);
    }
    .overlay.visible {
      opacity: 1;
      visibility: visible;
    }

    /* ─── Sidebar 抽屉 ─── */
    .sidebar-drawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: var(--sidebar-width);
      max-width: 85vw;
      background: var(--background);
      z-index: 100;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      transform: translateX(-100%);
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 4px 0 24px rgba(0, 0, 0, 0.15);
    }
    .sidebar-drawer.open {
      transform: translateX(0);
    }

    /* 安全区顶部（状态栏占位） */
    .sidebar-status-pad {
      height: 48px;
      flex-shrink: 0;
      background: var(--background);
    }

    /* ─── Sidebar 主体 ─── */
    .sidebar {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* 品牌栏 */
    .brand-area {
      padding: 0 16px 8px;
    }
    .brand-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 16px;
    }
    .brand-logo {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      object-fit: contain;
      border-radius: 6px;
    }
    .brand-name {
      font-size: 16px;
      font-weight: 600;
      color: var(--foreground);
      flex: 1;
    }

    /* 快捷入口菜单 */
    .quick-menu {
      margin-top: 8px;
      border-radius: 12px;
      overflow: hidden;
    }
    .quick-menu-item {
      width: 100%;
      padding: 10px 0;
      display: flex;
      align-items: center;
      gap: 10px;
      text-align: left;
      background: none;
      border: none;
      cursor: pointer;
      transition: background 0.15s;
      font-family: inherit;
    }
    .quick-menu-item:hover {
      background: var(--muted);
    }
    .quick-menu-item .icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: var(--muted-foreground);
    }
    .quick-menu-item .label {
      font-size: 14px;
      color: var(--foreground);
      flex: 1;
    }
    .quick-menu-item .chevron {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      color: var(--muted-foreground);
    }
    .quick-menu-item .meta {
      font-size: 12px;
      color: var(--primary);
      flex-shrink: 0;
    }
    .quick-menu-item .dot-unread {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
      flex-shrink: 0;
    }

    /* 分割线 */
    .divider {
      margin: 0 16px;
      border-top: 1px solid var(--border);
    }

    /* ─── CloudPanel ─── */
    .cloud-panel {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }
    .cloud-panel::-webkit-scrollbar {
      width: 0;
    }

    /* 新建任务按钮 */
    .new-task-btn {
      margin: 0 16px 8px;
      width: calc(100% - 32px);
      padding: 10px 0;
      border-radius: 12px;
      background: var(--primary);
      color: var(--primary-foreground);
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      border: none;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    .new-task-btn:hover {
      opacity: 0.9;
    }

    /* 会话列表 */
    .conv-list {
      list-style: none;
    }
    .conv-item {
      padding: 0;
    }
    .conv-item-btn {
      width: 100%;
      text-align: left;
      padding: 12px 16px;
      font-size: 14px;
      border-radius: 8px;
      transition: background 0.15s;
      border: none;
      background: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: inherit;
      color: var(--foreground);
      user-select: none;
    }
    .conv-item-btn:hover {
      background: var(--muted);
    }
    .conv-item-btn .title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    /* 状态标记 */
    .status-running {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      color: var(--primary);
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .status-dot-wrap {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
    }
    .status-pending {
      flex-shrink: 0;
      font-size: 10px;
      font-weight: 500;
      padding: 2px 6px;
      border-radius: 6px;
      background: rgba(234, 179, 8, 0.2);
      color: #ca8a04;
    }

    /* ─── 底部栏 ─── */
    .bottom-bar {
      flex-shrink: 0;
      margin: 0 16px;
      border-top: 1px solid var(--border);
    }
    .bottom-bar-inner {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 0 24px;
    }
    .user-btn {
      flex: 1;
      min-width: 0;
      height: 40px;
      display: flex;
      align-items: center;
      font-size: 16px;
      font-weight: 500;
      color: var(--foreground);
      background: none;
      border: none;
      cursor: pointer;
      font-family: inherit;
      transition: opacity 0.15s;
      text-align: left;
    }
    .user-btn:hover {
      opacity: 0.8;
    }
    .user-btn .name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .user-btn .chevron-sm {
      width: 16px;
      height: 16px;
      margin-left: 4px;
      flex-shrink: 0;
    }
    .credits {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .credits-ring {
      width: 20px;
      height: 20px;
      transform: rotate(-60deg);
    }
    .credits-text {
      font-size: 14px;
      font-weight: 500;
      color: var(--foreground);
    }

    /* ─── 底部安全区 ─── */
    .safe-area {
      height: 34px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<!-- 背景页面（模拟主页内容） -->
<div class="bg-page" id="bgPage">
  <div class="bg-header">
    <button class="bg-hamburger" id="menuBtn" aria-label="打开菜单">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6" x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>
    <h1 class="bg-title">WorkBuddy</h1>
  </div>

  <div class="bg-content">
    <!-- 占位图标 -->
    <svg class="placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    <p>点击左上角菜单按钮<br/>打开侧边栏</p>
    <button class="cta-btn">开始对话</button>
  </div>
</div>

<!-- 遮罩 -->
<div class="overlay" id="overlay"></div>

<!-- Sidebar 抽屉 -->
<div class="sidebar-drawer open" id="sidebarDrawer">
  <div class="sidebar-status-pad"></div>

  <div class="sidebar">
    <!-- 品牌栏 -->
    <div class="brand-area">
      <div class="brand-row">
        <img class="brand-logo" src="/icons/logo.png" alt="WorkBuddy" />
        <p class="brand-name">WorkBuddy</p>
      </div>

      <!-- 快捷入口 -->
      <div class="quick-menu">
        <!-- 自动化 -->
        <button class="quick-menu-item">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span class="label">自动化</span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <!-- 专家 -->
        <button class="quick-menu-item">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          <span class="label">专家</span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <!-- 电脑助理 -->
        <button class="quick-menu-item">
          <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="14" x="2" y="3" rx="2"/><line x1="8" x2="16" y1="21" y2="21"/><line x1="12" x2="12" y1="17" y2="21"/></svg>
          <span class="label">电脑助理</span>
          <span class="dot-unread"></span>
          <span class="meta">3台已连接</span>
          <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
      </div>
    </div>

    <!-- 分割线 -->
    <div class="divider"></div>

    <!-- CloudPanel：新建任务 + 会话列表 -->
    <div class="cloud-panel">
      <button class="new-task-btn">新建任务</button>
      <ul class="conv-list">
        <!-- 活跃会话 (running) — 无选中态 -->
        <li class="conv-item">
          <button class="conv-item-btn">
            <span class="title">React hooks 最佳实践</span>
            <svg class="status-running" width="14" height="14" viewBox="0 0 14 14" fill="none">
              <path fillRule="evenodd" clipRule="evenodd" d="M1.4392 2.7482C1.6274 2.50207 1.8311 2.26943 2.0503 2.0503C2.26943 1.8311 2.50207 1.6274 2.7482 1.4392L4.7106 4.0057C4.44427 4.2093 4.2093 4.44427 4.0057 4.7106L1.4392 2.7482ZM0.0553 7.8779C0.0369 7.7323 0.0230667 7.58627 0.0138 7.4398C0.0046 7.29333 0 7.14673 0 7C0 6.85327 0.0046 6.70667 0.0138 6.5602C0.0230667 6.41373 0.0369 6.2677 0.0553 6.1221L3.2605 6.5273C3.2407 6.68423 3.2308 6.8418 3.2308 7C3.2308 7.1582 3.2407 7.31577 3.2605 7.4727L0.0553 7.8779ZM2.7482 12.5608C2.50207 12.3726 2.26943 12.1689 2.0503 11.9497C1.8311 11.7306 1.6274 11.4979 1.4392 11.2518L4.0057 9.2894C4.2093 9.55573 4.44427 9.7907 4.7106 9.9943L2.7482 12.5608ZM7.8779 13.9447C7.7323 13.9631 7.58627 13.9769 7.4398 13.9862C7.29333 13.9954 7.14673 14 7 14C6.85327 14 6.70667 13.9954 6.5602 13.9862C6.41373 13.9769 6.2677 13.9631 6.1221 13.9447L6.5273 10.7395C6.68423 10.7593 6.8418 10.7692 7 10.7692C7.1582 10.7692 7.31577 10.7593 7.4727 10.7395L7.8779 13.9447ZM12.5608 11.2518C12.3726 11.4979 12.1689 11.7306 11.9497 11.9497C11.7306 12.1689 11.4979 12.3726 11.2518 12.5608L9.2894 9.9943C9.55573 9.7907 9.7907 9.55573 9.9943 9.2894L12.5608 11.2518ZM13.9447 6.1221C13.9631 6.2677 13.9769 6.41373 13.9862 6.5602C13.9954 6.70667 14 6.85327 14 7C14 7.14673 13.9954 7.29333 13.9862 7.4398C13.9769 7.58627 13.9631 7.7323 13.9447 7.8779L10.7395 7.4727C10.7593 7.31577 10.7692 7.1582 10.7692 7C10.7692 6.8418 10.7593 6.68423 10.7395 6.5273L13.9447 6.1221ZM11.2518 1.4392C11.4979 1.6274 11.7306 1.8311 11.9497 2.0503C12.1689 2.26943 12.3726 2.50207 12.5608 2.7482L9.9943 4.7106C9.7907 4.44427 9.55573 4.2093 9.2894 4.0057L11.2518 1.4392ZM7.8779 0.0553L7.4727 3.2605C7.31577 3.2407 7.1582 3.2308 7 3.2308C6.8418 3.2308 6.68423 3.2407 6.5273 3.2605L6.1221 0.0553C6.2677 0.0369 6.41373 0.0230667 6.5602 0.0138C6.70667 0.0046 6.85327 0 7 0C7.14673 0 7.29333 0.0046 7.4398 0.0138C7.58627 0.0230667 7.7323 0.0369 7.8779 0.0553Z" fill="currentColor"/>
            </svg>
          </button>
        </li>
        <!-- 待确认会话 -->
        <li class="conv-item">
          <button class="conv-item-btn">
            <span class="title">设计评审 PPT 大纲</span>
            <span class="status-pending">待确认</span>
          </button>
        </li>
        <!-- 已完成未读会话 -->
        <li class="conv-item">
          <button class="conv-item-btn">
            <span class="title">怎么提升专注力</span>
            <span class="status-dot-wrap"><span class="status-dot"></span></span>
          </button>
        </li>
        <!-- 普通会话 -->
        <li class="conv-item">
          <button class="conv-item-btn">
            <span class="title">西班牙语入门学习计划</span>
          </button>
        </li>
        <li class="conv-item">
          <button class="conv-item-btn">
            <span class="title">Figma 变量系统怎么用</span>
          </button>
        </li>
      </ul>
    </div>

    <!-- 底部栏 -->
    <div class="bottom-bar">
      <div class="bottom-bar-inner">
        <button class="user-btn">
          <span class="name">JosephDeng</span>
          <svg class="chevron-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
        </button>
        <span class="credits">
          <svg class="credits-ring" viewBox="0 0 36 36">
            <circle cx="18" cy="18" r="10" fill="none" stroke="currentColor" stroke-width="3.5" style="color: rgba(62,62,62,0.25);"/>
            <circle cx="18" cy="18" r="10" fill="none" stroke="currentColor" stroke-width="3.5" stroke-dasharray="54 63" stroke-linecap="round" style="color: rgba(26,26,26,0.5);"/>
          </svg>
          <span class="credits-text">积分 12,492</span>
        </span>
      </div>
    </div>

    <div class="safe-area"></div>
  </div>
</div>

<script>
  // 抽屉开关
  const sidebar = document.getElementById('sidebarDrawer');
  const overlay = document.getElementById('overlay');
  const bgPage = document.getElementById('bgPage');
  const menuBtn = document.getElementById('menuBtn');

  function openSidebar() {
    sidebar.classList.add('open');
    overlay.classList.add('visible');
    bgPage.classList.add('blurred');
  }

  function closeSidebar() {
    sidebar.classList.remove('open');
    overlay.classList.remove('visible');
    bgPage.classList.remove('blurred');
  }

  menuBtn.addEventListener('click', openSidebar);
  overlay.addEventListener('click', closeSidebar);

  // 默认打开，方便预览
  openSidebar();
</script>

</body>
</html>
