<!DOCTYPE html>
<html lang="zh-CN" class="">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Model Selector Sheet</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --background: oklch(0.9911 0 0);
    --foreground: oklch(0.2046 0 0);
    --muted-foreground: oklch(0.2435 0 0);
    --primary: #00C29A;

    --model-selector-panel-bg: oklch(1 0 0 / 0.7);
    --model-selector-panel-blur: 40px;
    --model-selector-panel-saturate: 2;
    --model-selector-panel-border: oklch(1 0 0 / 0.65);
    --model-selector-panel-shadow: 0 12px 36px oklch(0 0 0 / 0.18);
    --model-selector-panel-inner-highlight: oklch(1 0 0 / 0.72);

    --safe-area-inset-bottom: env(safe-area-inset-bottom, 0px);
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", system-ui, sans-serif;
  }

  html, body {
    height: 100dvh;
    overflow: hidden;
    font-family: var(--font-sans);
    background: var(--background);
    color: var(--foreground);
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
  }

  /* ========== Sheet Panel — 自身 translateY 出入场 ========== */
  .model-panel {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 121;
    border-radius: 44px 44px 0 0;
    border: none;
    border-top: 1px solid var(--model-selector-panel-border);
    background: var(--model-selector-panel-bg);
    backdrop-filter: blur(var(--model-selector-panel-blur)) saturate(var(--model-selector-panel-saturate));
    -webkit-backdrop-filter: blur(var(--model-selector-panel-blur)) saturate(var(--model-selector-panel-saturate));
    box-shadow: var(--model-selector-panel-shadow), inset 0 0.5px 0 var(--model-selector-panel-inner-highlight);
    /* 入场/出场 transition 由 JS 动态设置 */
    transform: translateY(100%);
    opacity: 0;
  }
  .model-panel.open {
    transform: translateY(0);
    opacity: 1;
  }

  /* ========== Sheet Header ========== */
  .model-panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 24px 20px 0;
  }
  .model-panel-title {
    font-size: 16px;
    font-weight: 600;
    font-family: var(--font-sans);
    color: var(--foreground);
  }
  .model-panel-auto-toggle {
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .model-panel-auto-label {
    font-size: 12px;
    color: var(--muted-foreground);
  }

  /* ========== iOS Switch ========== */
  .ios-switch {
    position: relative;
    display: inline-flex;
    cursor: pointer;
    align-items: center;
  }
  .ios-switch input {
    position: absolute;
    opacity: 0;
    width: 0;
    height: 0;
    pointer-events: none;
  }
  .ios-switch-track {
    width: 51px;
    height: 31px;
    border-radius: 9999px;
    background: #E9E9EA;
    transition: background 0.2s;
    position: relative;
  }
  .ios-switch input:checked + .ios-switch-track {
    background: #34C759;
  }
  .ios-switch-thumb {
    position: absolute;
    top: 2px;
    left: 2px;
    width: 27px;
    height: 27px;
    border-radius: 9999px;
    background: white;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15), 0 1px 1px rgba(0,0,0,0.06);
    transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .ios-switch input:checked + .ios-switch-track .ios-switch-thumb {
    transform: translateX(20px);
  }

  /* ========== Panel Content — max-height 过渡 ========== */
  .model-panel-content {
    overflow: hidden;
  }

  /* ========== Auto mode ========== */
  .model-panel-auto-text {
    padding: 0 20px calc(1rem + var(--safe-area-inset-bottom));
    font-size: 14px;
    color: rgba(39, 39, 42, 0.7);
  }

  /* ========== Manual mode ========== */
  .model-panel-tabs {
    padding: 0 20px 10px;
  }
  .model-panel-tabs-inner {
    display: flex;
    gap: 4px;
    padding: 4px;
    border-radius: 16px;
    background: rgba(0,0,0,0.04);
    border: 1px solid rgba(255,255,255,0.2);
  }
  .model-tab-btn {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 1px;
    padding: 6px 0;
    border-radius: 12px;
    border: none;
    background: transparent;
    font-size: 12px;
    font-weight: 500;
    font-family: var(--font-sans);
    color: var(--muted-foreground);
    cursor: pointer;
    transition: all 0.25s;
  }
  .model-tab-btn.active {
    background: rgba(255,255,255,0.7);
    color: var(--foreground);
    box-shadow: 0 1px 4px oklch(0 0 0 / 0.08), inset 0 0.5px 0 oklch(1 0 0 / 0.5);
  }
  .model-tab-btn:not(.active):hover {
    color: var(--foreground);
    background: rgba(255,255,255,0.3);
  }
  .model-tab-btn-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .model-tab-btn-icon {
    width: 14px;
    height: 14px;
    flex-shrink: 0;
  }
  .model-tab-btn-label {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .model-tab-btn-sublabel {
    font-size: 10px;
    line-height: 1.2;
    color: rgba(39, 39, 42, 0.5);
  }

  /* ========== Model list ========== */
  .model-panel-list-wrapper {
    overflow: hidden;
  }
  .model-panel-list-scroll {
    display: flex;
    height: 100%;
    transition: transform 0.3s ease-in-out;
  }
  .model-panel-list-col {
    width: 100%;
    flex-shrink: 0;
    overflow-y: auto;
    padding: 0 20px var(--safe-area-inset-bottom);
    scrollbar-width: none;
  }
  .model-panel-list-col::-webkit-scrollbar {
    display: none;
  }

  .model-provider-group {
    padding: 2px 0;
  }
  .model-provider-header {
    padding: 4px 8px;
    font-size: 12px;
    font-weight: 500;
    color: rgba(39, 39, 42, 0.7);
  }
  .model-item-btn {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    border-radius: 12px;
    padding: 8px 10px;
    border: none;
    background: transparent;
    cursor: pointer;
    transition: all 0.2s;
    font-family: var(--font-sans);
    text-align: left;
  }
  .model-item-btn:hover {
    background: rgba(255,255,255,0.3);
  }
  .model-item-btn:active {
    background: rgba(255,255,255,0.4);
  }
  .model-item-btn.selected {
    background: rgba(255,255,255,0.5);
    box-shadow: 0 1px 3px oklch(0 0 0 / 0.04), inset 0 0.5px 0 oklch(1 0 0 / 0.4);
  }
  .model-item-icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
  }
  .model-item-name {
    font-size: 14px;
    font-weight: 600;
    flex: 1;
    color: var(--foreground);
  }
  .model-item-credits {
    font-size: 10px;
    color: rgba(39, 39, 42, 0.5);
    font-variant-numeric: tabular-nums;
    margin-right: -10px;
  }
  .model-item-check {
    width: 16px;
    height: 16px;
    flex-shrink: 0;
    opacity: 0;
    transition: opacity 0.2s;
    color: var(--primary);
  }
  .model-item-btn.selected .model-item-check {
    opacity: 1;
  }
</style>
</head>
<body>

  <div class="model-panel" id="panel">
    <!-- Header (始终显示) -->
    <div class="model-panel-header">
      <div class="model-panel-title">模型</div>
      <div class="model-panel-auto-toggle">
        <span class="model-panel-auto-label">自动</span>
        <label class="ios-switch">
          <input type="checkbox" id="autoSwitch" checked />
          <div class="ios-switch-track">
            <div class="ios-switch-thumb"></div>
          </div>
        </label>
      </div>
    </div>

    <!-- 内容区 — max-height 过渡控制高度变化 -->
    <div class="model-panel-content" id="panelContent">
      <!-- Auto mode -->
      <div id="autoContent">
        <div class="model-panel-auto-text">将根据您的需求为您选择最佳模型</div>
      </div>

      <!-- Manual mode (tabs + list) -->
      <div id="manualContent" style="display:none;">
        <div class="model-panel-tabs">
          <div class="model-panel-tabs-inner">
            <button class="model-tab-btn active" data-tab="reasoning">
              <div class="model-tab-btn-row">
                <svg class="model-tab-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                <span class="model-tab-btn-label">对话模型</span>
              </div>
              <span class="model-tab-btn-sublabel">适合纯文本对话</span>
            </button>
            <button class="model-tab-btn" data-tab="vision">
              <div class="model-tab-btn-row">
                <svg class="model-tab-btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                <span class="model-tab-btn-label">视觉模型</span>
              </div>
              <span class="model-tab-btn-sublabel">适合图片/视频生成</span>
            </button>
          </div>
        </div>

        <div class="model-panel-list-wrapper">
          <div class="model-panel-list-scroll" id="listScroll">
            <div class="model-panel-list-col" id="colReasoning"></div>
            <div class="model-panel-list-col" id="colVision"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

    // ========== State ==========
    let state = {
      open: false,
      autoMode: true,
      selected: null,
      activeTab: "reasoning"
    };

    // ========== DOM refs ==========
    const panel = document.getElementById("panel");
    const autoSwitch = document.getElementById("autoSwitch");
    const autoContent = document.getElementById("autoContent");
    const manualContent = document.getElementById("manualContent");
    const panelContent = document.getElementById("panelContent");
    const listScroll = document.getElementById("listScroll");
    const colReasoning = document.getElementById("colReasoning");
    const colVision = document.getElementById("colVision");
    const tabBtns = document.querySelectorAll(".model-tab-btn");

    // ========== Helpers ==========
    function formatCredits(c) {
      return "x" + c.toFixed(2);
    }

    function getProviderSVG(provider) {
      return providerSVGs[provider] || "";
    }

    function renderModelList() {
      ["reasoning", "vision"].forEach(tag => {
        const col = tag === "reasoning" ? colReasoning : colVision;
        const tabModels = models.filter(m => m.tags.includes(tag) && !m.hidden);
        const providers = [...new Set(tabModels.map(m => m.provider))];

        col.innerHTML = "";
        providers.forEach(provider => {
          const group = document.createElement("div");
          group.className = "model-provider-group";

          const header = document.createElement("div");
          header.className = "model-provider-header";
          header.textContent = provider;
          group.appendChild(header);

          const providerModels = tabModels.filter(m => m.provider === provider);
          providerModels.forEach(model => {
            const btn = document.createElement("button");
            btn.className = "model-item-btn";
            btn.dataset.modelId = model.id;

            const isSelected = !state.autoMode && state.selected && state.selected.id === model.id;
            if (isSelected) btn.classList.add("selected");

            const iconSpan = document.createElement("span");
            iconSpan.className = "model-item-icon";
            iconSpan.innerHTML = getProviderSVG(model.provider);

            const nameSpan = document.createElement("span");
            nameSpan.className = "model-item-name";
            nameSpan.textContent = model.name;

            const creditsSpan = document.createElement("span");
            creditsSpan.className = "model-item-credits";
            creditsSpan.textContent = formatCredits(model.credits);

            const checkSvg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
            checkSvg.setAttribute("viewBox", "0 0 24 24");
            checkSvg.setAttribute("fill", "none");
            checkSvg.setAttribute("stroke", "currentColor");
            checkSvg.setAttribute("stroke-width", "2");
            checkSvg.setAttribute("stroke-linecap", "round");
            checkSvg.setAttribute("stroke-linejoin", "round");
            checkSvg.classList.add("model-item-check");
            const polyline = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
            polyline.setAttribute("points", "20 6 9 17 4 12");
            checkSvg.appendChild(polyline);

            btn.appendChild(iconSpan);
            btn.appendChild(nameSpan);
            btn.appendChild(creditsSpan);
            btn.appendChild(checkSvg);

            btn.addEventListener("click", () => {
              state.autoMode = false;
              state.selected = { id: model.id, provider: model.provider, shortName: model.shortName };
              autoSwitch.checked = false;
              closePanel();
              renderModelList();
            });

            group.appendChild(btn);
          });

          col.appendChild(group);
        });
      });
    }

    // ========== Content switch: 切换 auto/manual 显示 ==========
    function switchContent(showAuto) {
      const prevHeight = panelContent.offsetHeight;

      if (showAuto) {
        autoContent.style.display = "block";
        manualContent.style.display = "none";
      } else {
        manualContent.style.display = "block";
        autoContent.style.display = "none";
      }

      // 入场曲线过渡到新高度
      requestAnimationFrame(() => {
        const newHeight = panelContent.scrollHeight;
        panelContent.style.transition = "max-height 0.3s cubic-bezier(0, 0, 0.2, 1)";
        panelContent.style.maxHeight = prevHeight + "px";
        void panelContent.offsetHeight;
        panelContent.style.maxHeight = newHeight + "px";
      });
    }

    // ========== Panel open/close ==========
    function openPanel() {
      state.open = true;
      panel.style.transition = "transform 0.3s cubic-bezier(0, 0, 0.2, 1), opacity 0.3s cubic-bezier(0, 0, 0.2, 1)";
      panel.classList.add("open");
      document.body.style.overflow = "hidden";
      // 打开后内容区展开
      requestAnimationFrame(() => {
        panelContent.style.transition = "max-height 0.3s cubic-bezier(0, 0, 0.2, 1)";
        panelContent.style.maxHeight = panelContent.scrollHeight + "px";
      });
    }

    function closePanel() {
      state.open = false;
      // 出场：面板滑出 + 内容区同步收缩
      panel.style.transition = "transform 0.25s ease-in-out, opacity 0.25s ease-in-out";
      panel.classList.remove("open");
      panelContent.style.transition = "max-height 0.25s ease-in-out";
      panelContent.style.maxHeight = "0";
      document.body.style.overflow = "";
    }

    // ========== Event bindings ==========
    autoSwitch.addEventListener("change", (e) => {
      state.autoMode = e.target.checked;
      if (state.autoMode) {
        state.selected = null;
      } else {
        if (!state.selected) {
          const first = models.find(m => !m.hidden);
          if (first) state.selected = { id: first.id, provider: first.provider, shortName: first.shortName };
        }
      }
      switchContent(state.autoMode);
      renderModelList();
    });

    tabBtns.forEach(btn => {
      btn.addEventListener("click", () => {
        tabBtns.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        state.activeTab = btn.dataset.tab;
        listScroll.style.transform = state.activeTab === "reasoning" ? "translateX(0)" : "translateX(-100%)";
      });
    });

    // ========== Init ==========
    renderModelList();
    switchContent(state.autoMode);

    // Open panel on load for demo visibility
    setTimeout(() => openPanel(), 500);
  </script>
